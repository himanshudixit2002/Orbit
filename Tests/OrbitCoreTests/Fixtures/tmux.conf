# ╔══════════════════════════════════════════════════════╗
# ║              TMUX CONFIG — HACKER EDITION            ║
# ╚══════════════════════════════════════════════════════╝

# ===== General =====
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"    # True color
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # Undercurl
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g escape-time 0           # No delay for escape key
set -g history-limit 50000     # Scrollback buffer
set -g display-time 4000       # Messages display for 4s
set -g status-interval 5       # Refresh status every 5s
set -g focus-events on         # Focus events for vim
set -g mouse on                # Mouse support

# ===== Prefix =====
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ===== Window/Pane Indexing =====
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ===== Vi Mode =====
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# ===== Pane Splitting (Intuitive) =====
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ===== Smart Pane Navigation (Vim-aware) =====
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ===== Pane Resize =====
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== Quick Actions =====
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind S command-prompt -p "New session:" "new-session -A -s '%%'"
bind K confirm-before -p "Kill session #S? (y/n)" kill-session
bind -n M-z resize-pane -Z   # Alt-z to zoom

# ===== Status Bar =====
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#7aa2f7,bold] #S #[fg=#545c7e]│ "
set -g status-right "#[fg=#545c7e]│ #[fg=#e0af68]󰘳 #(whoami) #[fg=#545c7e]│ #[fg=#9ece6a] %H:%M #[fg=#545c7e]│ #[fg=#bb9af7]󰃰 %d-%b"

# Window status
setw -g window-status-format "#[fg=#545c7e] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "bg=#1a1b26,fg=#7aa2f7,bold"

# ===== TPM (Tmux Plugin Manager) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'     # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'          # Better copy/paste

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (keep at very bottom). Install new plugins with prefix + I.
run '~/.tmux/plugins/tpm/tpm'
